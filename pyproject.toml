[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mailforen"
dynamic = ["version"]
description = "Advanced OSINT toolkit for email forensics and digital investigations"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "mailforen contributors"}]
keywords = ["osint", "forensics", "email", "phishing", "dfir", "security"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
]

dependencies = [
    "typer[all]>=0.9.0",
    "rich>=13.7.0",
    "httpx[http2]>=0.25.0",
    "dnspython>=2.4.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "jinja2>=3.1.0",
    "python-dateutil>=2.8.0",
    "publicsuffix2>=2.20191221",
    "tldextract>=5.1.0",
    "eml-parser>=1.17.0",
    "pyspf>=2.0.14",
    "checkdmarc>=4.7.0",
    "exifread>=3.0.0",
    "python-magic>=0.4.27",
    "pdfkit>=1.0.0",
    "PySide6>=6.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "black>=23.11.0",
    "ruff>=0.1.6",
    "mypy>=1.7.0",
]

[project.scripts]
mailforen = "mailforen.cli:app"
mailforen-gui = "mailforen.gui.app:main"

[tool.setuptools.dynamic]
version = {attr = "mailforen.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true   # pdfkit, exifread, publicsuffix2 ship no stubs
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E4", "E7", "E9",  # pycodestyle errors
    "F",               # pyflakes
    "I",               # import sorting
    "UP",              # pyupgrade (PEP 585/604 modernization)
    "B",               # bugbear
    "C4",              # comprehensions
    "SIM",             # simplify
    "RUF",             # ruff-specific
]
ignore = [
    "B008",  # typer: function calls in argument defaults are the framework pattern
]

[tool.setuptools.packages.find]
where = ["."]
include = ["mailforen*"]