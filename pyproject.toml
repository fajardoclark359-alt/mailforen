[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mailforen"
version = "0.1.0"
description = "Advanced OSINT toolkit for email forensics and digital investigations"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "mailforen contributors"}]
keywords = ["osint", "forensics", "email", "phishing", "dfir", "security"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
]

dependencies = [
    "typer[all]>=0.9.0",
    "rich>=13.7.0",
    "httpx[http2]>=0.25.0",
    "dnspython>=2.4.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "jinja2>=3.1.0",
    "python-dateutil>=2.8.0",
    "publicsuffix2>=2.20191221",
    "tldextract>=5.1.0",
    "eml-parser>=1.17.0",
    "pyspf>=2.0.14",
    "checkdmarc>=4.7.0",
    "exifread>=3.0.0",
    "python-magic>=0.4.27",
    "pdfkit>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.11.0",
    "ruff>=0.1.6",
    "mypy>=1.7.0",
]

[project.scripts]
mailforen = "mailforen.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["mailforen*"]
